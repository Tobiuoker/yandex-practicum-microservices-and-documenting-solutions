version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d smarthome" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-network

  device-service-postgres:
    image: postgres:16-alpine
    container_name: smarthome-device-service-postgres
    environment:
      POSTGRES_USER: postgres_devices
      POSTGRES_PASSWORD: postgres_devices
      POSTGRES_DB: devices
    volumes:
      - devices_postgres_data:/var/lib/postgresql/data
      - ./device-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_devices -d devices" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-network

  telemetry-service-postgres:
    image: postgres:16-alpine
    container_name: smarthome-telemetry-service-postgres
    environment:
      POSTGRES_USER: postgres_telemetry
      POSTGRES_PASSWORD: postgres_telemetry
      POSTGRES_DB: telemetry
    volumes:
      - telemetry_postgres_data:/var/lib/postgresql/data
      - ./telemetry-service/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_telemetry -d telemetry" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    ports:
      - 8081:8081
    networks:
      - smarthome-network

  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    depends_on:
      device-service-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres_devices:postgres_devices@device-service-postgres:5432/devices
    ports:
      - 8082:8082
    networks:
      - smarthome-network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    depends_on:
      telemetry-service-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres_telemetry:postgres_telemetry@telemetry-service-postgres:5432/telemetry
    ports:
      - 8083:8083
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      device-service:
        condition: service_started
      telemetry-service:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - DEVICE_SERVICE_URL=http://device-service:8082
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8083
      - ENABLE_MICROSERVICES_SYNC=true
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  telemetry_postgres_data:
  devices_postgres_data:

networks:
  smarthome-network:
    driver: bridge